name: Build image

# Called by each image repo's build.yml, pinned to a commit of this repo. Tests every call. Only main publishes, and the
# image reaches a server only through its update. Inputs come from the caller's reviewed workflow file, never from a PR title
# or similar, so they are safe to run as commands.
on:
  workflow_call:
    inputs:
      test_command:
        description: Runs inside node:22-alpine, from the repo root. Empty to skip.
        type: string
        default: ""
      image_check:
        description: Runs on the host after the build; the image is tagged test-image. Empty to skip.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --redact --no-banner

      - name: Tests
        if: inputs.test_command != ''
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
        run: docker run --rm -e TEST_COMMAND -v "$PWD:/w" -w /w node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914 sh -c "$TEST_COMMAND"

      - name: Build
        run: docker build -t test-image .

      - name: Image check
        if: inputs.image_check != ''
        run: ${{ inputs.image_check }}

      - name: Smoke test
        run: sh scripts/smoke-test.sh test-image

  # The only job with write access. It rebuilds the tested Dockerfile from the same commit.
  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ghcr # deployments allowed from main only
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/drakknar/${{ github.event.repository.name }}:latest
            ghcr.io/drakknar/${{ github.event.repository.name }}:${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
